[project]
name = "yishou"
version = "0.1.0"
description = "Webcam classifier for the Chinese one-hand number gestures, 1 to 10"
authors = [
    { name = "David Worsley-Tonks", email = "david.worsley.tonks@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
keywords = ["gesture-recognition", "hand-tracking", "mediapipe", "pytorch", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # Hand tracking and camera
    "mediapipe>=0.10.14",          # 21 hand landmarks per frame
    "opencv-contrib-python>=4.9",  # webcam capture and preview (the build mediapipe expects)
    "numpy>=1.26",

    # Classifier, saved and loaded in the Hugging Face format
    "torch>=2.2",
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
]

[project.scripts]
yishou = "yishou.cli:main"

[project.urls]
Repository = "https://github.com/sparkup/yishou"

# The classifier is a small MLP that trains in seconds on a CPU, so Linux installs
# use the CPU build of PyTorch rather than the much larger CUDA one.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yishou"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
